name: Lint and Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check custom_components/ tests/
      - name: Run ruff format check
        run: ruff format --check custom_components/ tests/

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The pinned pytest-homeassistant-custom-component (Home Assistant
          # 2026.10.1) requires Python 3.14
          python-version: "3.14"
      - name: Install dependencies
        # requirements_test.txt brings the pinned Home Assistant version and
        # the full test toolchain (aioclient_mock, real hass fixture, ...)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q
